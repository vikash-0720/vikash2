
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3.20
      script: |
        #!/bin/sh
        echo "Starting workspace cleanup..."
        rm -rf "$(workspaces.source.path)"/*
        rm -rf "$(workspaces.source.path)"/.[!.]*
        echo "Workspace cleanup completed successfully"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
spec:
  workspaces:
    - name: source
  steps:
    - name: nose
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "Installing Nose..."
        pip install nose
        echo "Running unit tests..."
        nosetests -v
